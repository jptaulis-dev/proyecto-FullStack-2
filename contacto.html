<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuertoHogar - Contacto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="principal">
        <a href="index.html" class="logo">🥑 HuertoHogar</a>

        <nav class="menu">
            <a href="index.html">Home</a>
            <a href="productos.html">Productos</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="blog.html">Blog</a>
            <a href="contacto.html">Contacto</a>
        </nav>

       <div class="acciones-header">
            <!-- Saludo al usuario -->
            <span id="usuario-nav" style="color: white; font-weight: bold; margin-right: 15px;"></span>
            
            <!-- Botones de invitado -->
            <a href="login.html" id="link-login">Iniciar sesión</a>
            <a href="registro.html" id="link-registro">Registrarse</a>
            
            <!-- Botón de usuario logueado (Oculto por defecto) -->
            <a href="#" id="link-logout" style="display: none;" onclick="cerrarSesion()">Cerrar sesión</a>
            
            <!-- Carrito -->
            <a href="carrito.html" class="carrito-boton" id="contador-carrito">🛒 Carrito (0)</a>
        </div>
    </header>

    <main>
       <h1>Contacto</h1>
        <p>Envíanos un mensaje y te responderemos a la brevedad.</p>

        <!-- Formulario con sus identificadores -->
        <form id="form-contacto" class="formulario">
            <div class="grupo-form">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre">
                <span id="error-nombre" class="mensaje-error"></span>
            </div>

            <div class="grupo-form">
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo">
                <span id="error-correo" class="mensaje-error"></span>
            </div>

            <div class="grupo-form">
                <label for="comentario">Comentario:</label>
                <textarea id="comentario" name="comentario" rows="5"></textarea>
                <span id="error-comentario" class="mensaje-error"></span>
            </div>

            <button type="submit" class="boton">Enviar Mensaje</button>
            <p id="mensaje-exito" style="color: green; display: none; margin-top: 15px; font-weight: bold;">¡Mensaje enviado correctamente!</p>
        </form>
    </main>

    <footer class="principal">
        <p>&copy; 2026 HuertoHogar — Proyecto Evaluación 1, DSY1104</p>
    </footer>

    <script src="js/comun.js"></script>
    <script src="js/contacto.js"></script>

</body>
</html>
