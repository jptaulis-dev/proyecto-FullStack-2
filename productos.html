<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuertoHogar - Productos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="principal">
        <a href="index.html" class="logo">🥑 HuertoHogar</a>

        <nav class="menu">
            <a href="index.html">Home</a>
            <a href="productos.html">Productos</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="blog.html">Blog</a>
            <a href="contacto.html">Contacto</a>
        </nav>

       <div class="acciones-header">
            <!-- Botón directo al Panel Admin (Visible para la presentación) -->
            <a href="admin/productos.html" style="background-color: #FFD700; color: #333; padding: 8px 12px; border-radius: 6px; font-weight: bold; margin-right: 15px; text-decoration: none;">⚙️ Panel Admin</a>

            <!-- Saludo al usuario -->
            <span id="usuario-nav" style="color: white; font-weight: bold; margin-right: 15px;"></span>
            
            <!-- Botones de invitado -->
            <a href="login.html" id="link-login">Iniciar sesión</a>
            <a href="registro.html" id="link-registro">Registrarse</a>
            
            <!-- Botón de usuario logueado (Oculto por defecto) -->
            <a href="#" id="link-logout" style="display: none;" onclick="cerrarSesion()">Cerrar sesión</a>
            
            <!-- Carrito -->
            <a href="carrito.html" class="carrito-boton" id="contador-carrito">🛒 Carrito (0)</a>
        </div>
    </header>

    <main>
        <h1>Productos</h1>
        <section class="catalogo" aria-labelledby="titulo-catalogo">
            <h2 id="titulo-catalogo">Catálogo</h2>
            <div id="filtros-categoria" class="filtros-categoria" aria-label="Filtrar por categoría"></div>
            <div id="productos-contenedor" class="grid-productos"></div>
        </section>
    </main>

    <footer class="principal">
        <p>&copy; 2026 HuertoHogar — Proyecto Evaluación 1, DSY1104</p>
    </footer>

    <script src="js/producto.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/comun.js"></script>
    <script>
        function cargarFiltros() {
            const contenedorFiltros = document.getElementById("filtros-categoria");
            const categorias = productos
                .map(function (producto) {
                    return producto.categoria;
                })
                .filter(function (categoria, indice, lista) {
                    return lista.indexOf(categoria) === indice;
                });

            const categoriasConTodas = ["Todas"].concat(categorias);

            categoriasConTodas.forEach(function (categoria, indice) {
                const boton = document.createElement("button");
                boton.type = "button";
                boton.className = "boton filtro-categoria";
                boton.textContent = categoria;
                boton.addEventListener("click", function () {
                    mostrarProductos(filtrarPorCategoria(categoria), "productos-contenedor");
                    document.querySelectorAll(".filtro-categoria").forEach(function (filtro) {
                        filtro.classList.remove("activo");
                    });
                    boton.classList.add("activo");
                });

                if (indice === 0) {
                    boton.classList.add("activo");
                }

                contenedorFiltros.appendChild(boton);
            });
        }

        cargarFiltros();
        mostrarProductos(filtrarPorCategoria("Todas"), "productos-contenedor");
    </script>
</body>
</html>
