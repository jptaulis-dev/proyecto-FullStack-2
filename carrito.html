<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuertoHogar - Mi carrito</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="principal">
        <a href="index.html" class="logo">🥑 HuertoHogar</a>

        <nav class="menu">
            <a href="index.html">Home</a>
            <a href="productos.html">Productos</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="blog.html">Blog</a>
            <a href="contacto.html">Contacto</a>
        </nav>

       <div class="acciones-header">
            <!-- Botón directo al Panel Admin (Visible para la presentación) -->
            <a href="admin/productos.html" style="background-color: #FFD700; color: #333; padding: 8px 12px; border-radius: 6px; font-weight: bold; margin-right: 15px; text-decoration: none;">⚙️ Panel Admin</a>

            <!-- Saludo al usuario -->
            <span id="usuario-nav" style="color: white; font-weight: bold; margin-right: 15px;"></span>
            
            <!-- Botones de invitado -->
            <a href="login.html" id="link-login">Iniciar sesión</a>
            <a href="registro.html" id="link-registro">Registrarse</a>
            
            <!-- Botón de usuario logueado (Oculto por defecto) -->
            <a href="#" id="link-logout" style="display: none;" onclick="cerrarSesion()">Cerrar sesión</a>
            
            <!-- Carrito -->
            <a href="carrito.html" class="carrito-boton" id="contador-carrito">🛒 Carrito (0)</a>
        </div>
    </header>

    <main>
        <h1>Mi carrito</h1>
        
        <!-- 1. Aquí es donde JS inyectará las filas de productos -->
        <div id="items-carrito">
            <!-- Esto se llenará automáticamente -->
        </div>

        <div style="text-align: right; margin-top: 20px;">
            <!-- 2. Aquí es donde JS inyectará el precio total -->
            <h3>Total: <span id="total-carrito">$0</span></h3>
            <br>
            <button class="boton boton-oferta" onclick="pagar()">Pagar</button>
        </div>
    </main>

    <!-- PIE DE PÁGINA (Mantén el que ya tienes) -->
    <footer class="principal">
        <p>&copy; 2026 HuertoHogar — Proyecto Evaluación 1, DSY1104</p>
    </footer>

    <!-- 3. Orden estricto de los scripts -->
    <script src="js/comun.js"></script>
    <script src="js/producto.js"></script> <!-- El catálogo DEBE cargar antes que el carrito -->
    <script src="js/carrito.js"></script>
    
    <!-- 4. La chispa de encendido: llamamos a la función apenas abre la página -->
    <script>
        mostrarCarrito();
    </script>
</body>
</html>
