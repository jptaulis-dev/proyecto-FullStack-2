<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HuertoHogar - Detalle del blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="principal">
        <a href="index.html" class="logo">🥑 HuertoHogar</a>

        <nav class="menu">
            <a href="index.html">Home</a>
            <a href="productos.html">Productos</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="blog.html">Blog</a>
            <a href="contacto.html">Contacto</a>
        </nav>

       <div class="acciones-header">
            <!-- Botón directo al Panel Admin (Visible para la presentación) -->
            <a href="admin/productos.html" style="background-color: #FFD700; color: #333; padding: 8px 12px; border-radius: 6px; font-weight: bold; margin-right: 15px; text-decoration: none;">⚙️ Panel Admin</a>

            <!-- Saludo al usuario -->
            <span id="usuario-nav" style="color: white; font-weight: bold; margin-right: 15px;"></span>
            
            <!-- Botones de invitado -->
            <a href="login.html" id="link-login">Iniciar sesión</a>
            <a href="registro.html" id="link-registro">Registrarse</a>
            
            <!-- Botón de usuario logueado (Oculto por defecto) -->
            <a href="#" id="link-logout" style="display: none;" onclick="cerrarSesion()">Cerrar sesión</a>
            
            <!-- Carrito -->
            <a href="carrito.html" class="carrito-boton" id="contador-carrito">🛒 Carrito (0)</a>
        </div>
    </header>

    <main>
        <p><a href="blog.html">&larr; Volver al blog</a></p>

        <article id="detalle-blog">
            <p>Cargando artículo...</p>
        </article>
    </main>

    <footer class="principal">
        <p>&copy; 2026 HuertoHogar — Proyecto Evaluación 1, DSY1104</p>
    </footer>

    <script src="js/producto.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/blog.js"></script>
    <script>
        actualizarContadorCarrito();

        const idBlog = Number(new URLSearchParams(window.location.search).get("id"));
        let articulo = null;

        for (let i = 0; i < articulosBlog.length; i++) {
            if (articulosBlog[i].id === idBlog) {
                articulo = articulosBlog[i];
            }
        }

        const contenedor = document.getElementById("detalle-blog");

        if (articulo != null) {
            contenedor.innerHTML =
                "<img src='" + articulo.imagen + "' alt='" + articulo.titulo + "' style='width:100%; max-height:320px; object-fit:cover; border-radius:12px; margin-bottom:20px;'>" +
                "<h1>" + articulo.titulo + "</h1>" +
                "<p style='color:#333333; line-height:1.7;'>" + articulo.contenido + "</p>";
        } else {
            contenedor.innerHTML = "<p>Artículo no encontrado. <a href='blog.html'>Volver al blog</a></p>";
        }
    </script>

</body>
</html>
